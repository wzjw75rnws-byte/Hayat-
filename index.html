<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f0"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Hayat</title><style>body{margin:auto;max-width:680px;background:var(--bg);color:var(--ink);font:16px system-ui;padding:20px 16px 100px}*{box-sizing:border-box}h1,h2,h3{font-family:Georgia;font-weight:normal}h1{font-style:italic}button,input,textarea,select{font:inherit;color:inherit;border:1px solid var(--soft);border-radius:12px;padding:12px;background:var(--bg);max-width:100%}button{background:var(--soft);cursor:pointer}input,textarea,select{width:100%;margin:5px 0}textarea{min-height:100px}article{background:var(--soft);padding:16px;border-radius:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid button{min-height:75px;text-align:left}nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);display:flex;justify-content:center;gap:5px;padding:10px 4px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--soft)}nav button{font-size:13px;padding:10px}small{opacity:.75}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{padding:9px 0}.on{background:var(--ink);color:var(--bg)}progress{width:100%;accent-color:var(--ink)}img{max-width:100%;border-radius:12px}label{display:block}header{display:flex;justify-content:space-between;align-items:center} .art{font:48px Georgia;text-align:center}.calendar8{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:3px;text-align:center;align-items:center;margin:16px 0}.daycell{padding:7px 0;min-width:0}.outside{opacity:.45}header{position:sticky;top:0;background:var(--bg);z-index:5;padding:6px 0} .v5card{background:var(--bg);border:1px solid var(--soft);box-shadow:0 3px 12px #00 let D={};try{D=JSON.parse(localStorage.getItem('hayat-v1')||'{}')}catch(e){};const save=()=>{try{localStorage.setItem('hayat-v1',JSON.stringify(D))}catch(e){alert('Speicher voll oder nicht verfügbar. Bitte Backup exportieren.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let day=iso(new Date()),month=new Date(),page='Heute';const get=(k,v)=>D[k]??v;function set(k,v){D[k]=v;save()}const themes=[['Hayat','❀','#fbf7f0','#eee2d4','#70594b'],['Denge','♧','#f6f7ef','#e1e7d8','#52634c'],['Huzur','☾','#fcf5f5','#efdddf','#805d65']];function theme(){let t=themes[get('theme',0)];document.body.style.cssText=`--bg:${D.dark?'#292624':t[2]};--soft:${D.dark?'#403936':t[3]};--ink:${D.dark?'#eadbd0':t[4]}`;brand.textContent=t[0]+' '+t[1]};const btn=(s,code)=>`<button onclick="${esc(code)}">${esc(s)}</button>`;const q=JSON.stringify;function toggle(k,v){let a=get(k,[]);set(k,a.includes(v)?a.filter(x=>x!==v):[...a,v]);show(page)}function journal(k,qs){return qs.map((s,i)=>`<h3>${esc(s)}</h3><textarea onchange="set(${esc(q(k+i))},this.value)">${esc(get(k+i,''))}</textarea>`).join('')}function add(k,fields){return `<form onsubmit="event.preventDefault();set(${esc(q(k))},[...get(${esc(q(k))},[]),Object.fromEntries(new FormData(this))]);show(page)">${fields}<button>Speichern</button></form>`}const field=(n,p,t='text',v='')=>`<input required name="${n}" type="${t}" ${t==='number'?'step="any"':''} placeholder="${p}" value="${esc(v)}">`;function list(k){return get(k,[]).map((x,i)=>`<article><div class="row"><span>${esc(x.title||x.amount||x.date)} ${x.done?'✓':''}</span>${btn('✓',`edit(${q(k)},${i})`)}${btn('×',`remove(${q(k)},${i})`)}</div><small>${esc([x.date,x.note,x.amount,x.status].filter(Boolean).join(' · '))}</small></article>`).join('')}function edit(k,i){D[k][i].done=!D[k][i].done;save();show(page)}function remove(k,i){D[k].splice(i,1);save();show(page)}function grid(a){return '<div class="grid">'+a.map(x=>btn(x,`show(${q(x)})`)).join('')+'</div>'}function datebar(){return `<input type="date" value="${day}" onchange="day=this.value;show(page)">`}function show(p){let oldY=window.scrollY;if(p!==page&&!goingBack5){stack5.push({p:page,y:oldY,day});}let same=p===page;page=p;theme();let h=`<h1>${esc(p)}</h1>`;let k=p+day;if(view5(p)!==null){h+=view5(p)}else if(p==='Heute'){h='<h1>Mein schöner Alltag</h1><small>'+new Date().toLocaleDateString('de-DE',{dateStyle:'full'})+'</small><article>'+journal('priority'+day,['Meine Prioritäten'])+'</article>'+grid(get('homePins',['Wassertracker','Gebetstracker','Stimmungstracker','Habit-Tracker','Dankbarkeitstagebuch','Kalender']))}else if(p==='Bereiche'){h+=Object.entries(groups).map(([g,a])=>`<h2>${g}</h2>${grid(a)}`).join('')}else if(p==='Einstellungen'){h+=themes.map((t,i)=>btn(t[0],`set('theme',${i});show(page)`)).join(' ')+btn('Dunkelmodus',`set('dark',!D.dark);show(page)`)+`<article><h3>Datensicherung</h3>${btn('Backup exportieren','backup()')}<p>Backup wiederherstellen (ersetzt aktuelle Daten)</p><input type="file" accept=".json" onchange="restore(this.files[0])"></article>${pins()}<small>Daten bleiben in diesem Browser. Backups regelmäßig außerhalb der App sichern.</small>`}else if(extra(p)!==null){h+=extra(p)}else if(p==='Kalender'){h+=calendarV2()}else if(p==='Fastentracker & Nachholfasten'){h+=datebar()+fasting()}else if(p==='Leseliste'){h+=books()}else if(p==='Sparziele'){h+=savings()}else if(p==='Habit-Tracker'){h+=habits()}else if(p==='Haushaltsplan'||p==='Einkaufsliste'){h+=categorized(p)}else if(p==='Wassertracker'){let n=get(k,0);h+=datebar()+`<article><h2>${n*250} ml</h2><progress value="${n}" max="8"></progress><div class="grid">${Array.from({length:8},(_,i)=>btn(i<n?'💧 250 ml':'♧ 250 ml',`set(${q(k)},${i+1});show(page)`)).join('')}</div>${btn('− Glas',`set(${q(k)},${Math.max(0,n-1)});show(page)`)}</article>`}else if(['Gebetstracker','Koran-Lesetracker','Ramadan-Planer','Habit-Tracker'].includes(p)){let a=p==='Gebetstracker'?['Sabah','Öğle','İkindi','Akşam','Yatsı']:Array.from({length:p==='Habit-Tracker'?new Date(+day.slice(0,4),+day.slice(5,7),0).getDate():30},(_,i)=>i+1);let key=p==='Gebetstracker'?k:p+day.slice(0,p==='Koran-Lesetracker'?4:7);h+=datebar()+`<div class="art">${p==='Habit-Tracker'?'❀':'☾'}</div><progress value="${get(key,[]).length}" max="${a.length}"></progress><div class="grid">${a.map(x=>btn((get(key,[]).includes(x)?'✓ ':'○ ')+x,`toggle(${q(key)},${q(x)})`)).join('')}</div>`}else if(p==='Stimmungstracker'){h+=datebar()+gridMood(k)+journal(k,['Was hat meinen Tag geprägt?'])}else if(p==='Vision Board'){h+=`<div class="grid">${get(p,[]).map(x=>`<article>${x.image?`<img src="${esc(x.image)}">`:''}<h3>${esc(x.title)}</h3></article>`).join('')}</div><input id="dream" placeholder="Mein Traum"><input id="photo" type="file" accept="image/*">${btn('Hinzufügen','vision()')}`}else if(['Dankbarkeitstagebuch','Persönliches Tagebuch','Monatsreflexion','Jahres- und Monatsziele','Essensplanung','Symptomtagebuch','Zykluskalender'].includes(p)){h+=datebar()+journal(k,({'Dankbarkeitstagebuch':['Drei Dinge, für die ich dankbar bin','Mein schönster Moment'],'Monatsreflexion':['Was habe ich erreicht?','Was habe ich gelernt?','Was möchte ich ändern?'],'Jahres- und Monatsziele':['Meine Vision','Meine nächsten Schritte'],'Essensplanung':['Frühstück','Mittagessen','Abendessen','Snacks'],'Zykluskalender':['Blutung und Symptome']}[p]||['Meine Gedanken']))}else if(['Gewichtstracker','Schrittetracker','Schlaftracker','Sparziele','Einnahmen & Ausgaben','Monatliches Budget','Reisebudget'].includes(p)){let key=p==='Monatliches Budget'?'Einnahmen & Ausgaben':p,a=get(key,[]);h+=`<article><h2>${p==='Gewichtstracker'?(a.at(-1)?.amount||'–')+' kg':a.reduce((s,x)=>s+Number(x.amount||0)*(x.status==='Ausgabe'?-1:1),0).toLocaleString('de-DE')}</h2></article>`+list(key)+add(key,field('title',' function localDate(s){return new Date(s+'T12:00:00')}
function shift(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){return shift(d,-(d.getDay()+6)%7)}
function kw(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));return Math.ceil(((x-new Date(Date.UTC(x.getUTCFullYear(),0,1)))/86400000+1)/7)}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)}
function holidays(y){let h={};for(let [m,d,n] of [[1,1,'Neujahr'],[3,8,'Internationaler Frauentag (Berlin)'],[5,1,'Tag der Arbeit'],[10,3,'Tag der Deutschen Einheit'],[12,25,'1. Weihnachtstag'],[12,26,'2. Weihnachtstag']])h[iso(new Date(y,m-1,d))]=n;for(let [n,t] of [[-2,'Karfreitag'],[1,'Ostermontag'],[39,'Christi Himmelfahrt'],[50,'Pfingstmontag']])h[iso(shift(easter(y),n))]=t;if(y===2028)h['2028-06-17']='Einmaliger Feiertag Berlin';return h}
function chooseDate(s){day=s;month=localDate(s);show(page)}
function calMove(n){let x=localDate(day);if(calendarView==='Tag'||calendarView==='Woche')x=shift(x,n*(calendarView==='Tag'?1:7));else x=new Date(x.getFullYear()+(calendarView==='Jahr'?n:0),x.getMonth()+(calendarView==='Monat'?n:0),1);chooseDate(iso(x))}
function calendarV2(){let x=localDate(day),y=x.getFullYear(),m=x.getMonth(),fmt=(d,o)=>d.toLocaleDateString('de-DE',o),events=get('Termine',[]),holiday=d=>holidays(d.getFullYear())[iso(d)],cell=d=>{let s=iso(d),h=holiday(d);return `<button class="daycell ${s===day?'on':''} ${d.getMonth()!==m?'outside':''}" onclick="chooseDate('${s}')" aria-label="${esc(s+' '+(h||''))}">${d.getDate()}<small style="display:block;height:12px;color:${s===day?'inherit':'#a65d64'}">${h?'◆':''}${religious[s]?'☾':''}${school(s)?'▧':''}${events.some(e=>e.date===s)?'•':''}</small></button>`};let out=`<div class="art">${['❄','❄','❀','❀','❀','☀','☀','☀','❧','❧','❧','❄'][m]}</div><div class="row">${btn('‹','calMove(-1)')}<h2>${calendarView==='Jahr'?y:fmt(x,{month:'long',year:'numeric'})}</h2>${btn('›','calMove(1)')}</div><div class="row">${['Tag','Woche','Monat','Jahr'].map(v=>btn(v,`calendarView=${q(v)};show(page)`)).join('')}</div>`;
if(calendarView==='Jahr')out+='<div class="grid">'+Array.from({length:12},(_,i)=>btn(fmt(new Date(y,i,1),{month:'long'}),`calendarView='Monat';chooseDate('${iso(new Date(y,i,1))}')`)).join('')+'</div>';
else if(calendarView!=='Tag'){let start=monday(calendarView==='Woche'?x:new Date(y,m,1)),rows=calendarView==='Woche'?1:Math.ceil(((new Date(y,m,1).getDay()+6)%7+new Date(y,m+1,0).getDate())/7);out+='<div class="calendar8"><small>KW</small>'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(v=>`<small>${v}</small>`).join('')+Array.from({length:rows},(_,i)=>`<small>${kw(shift(start,i*7))}</small>`+Array.from({length:7},(_,j)=>cell(shift(start,i*7+j))).join('')).join('')+'</div>'}
out+=`<small>☾ Islamischer Termin · ◆ Gesetzlicher Feiertag · ▧ Schulferien · • Termin</small>${datebar()}<article><h3>${fmt(x,{weekday:'long',day:'numeric',month:'long'})} · KW ${kw(x)}</h3>${religious[day]?`<p>☾ ${esc(religious[day])}</p>`:''}${school(day)?`<p>▧ ${esc(school(day))}</p>`:''}${holiday(x)?`<p>◆ ${esc(holiday(x))}</p>`:''}${events.map((e,i)=>e.date===day?`<div class="row"><span>${esc(e.note)} ${esc(e.title)}</span>${btn('×',`remove('Termine',${i})`)}</div>`:'').join('')}${add('Termine',field('title','Termin')+field('date','','date',day)+field('note','Uhrzeit','time'))}</article><h3>Feiertage im Monat</h3>${Object.entries(holidays(y)).filter(([s])=>s.slice(0,7)===day.slice(0,7)).sort().map(([s,n])=>`<p>${fmt(localDate(s),{day:'numeric',month:'long'})} · ${esc(n)}</p>`).join('')||'Keine gesetzlichen Feiertage.'}<p><small>Schulferien: amtliche Termine bis August 2028; spätere Termine noch nicht hinterlegt. Islamische Termine: 2026/2027 nach veröffentlichten Diyanet-Übersichten (Sekundärquellen). Feiertage nach regulären heutigen Regeln berechnet; einmalige Sonderfeiertage nicht enthalten.</small></p>`;return out}
function gridMood(k){return '<article>'+['😢','🙁','😐','🙂','♡'].map(x=>btn(x,`set(${q(k)},${q(x)});show(page)`)).join(' ')+'<h2>'+esc(get(k,''))+'</h2></article>'}function move(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);show(page)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='hayat-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f||!confirm('Aktuelle Daten ersetzen?'))return;try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||Array.isArray(x)||!Number.isInteger(x.theme??0)||(x.theme??0)<0||(x.theme??0)>2)throw Error();D=x;save();show(page)}catch(e){alert('Ungültiges Backup')}}async function vision(){let title=dream.value,f=photo.files[0];if(!title)return;let image='';if(f){if(f.size>1000000){alert('Bitte Foto unter 1 MB wählen');return}image=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}set(page,[...get(page,[]),{title,image}]);show(page)}
const breaks=[['2026-10-19','2026-10-31','Herbstferien'],['2026-12-23','2027-01-02','Weihnachtsferien'],['2027-02-01','2027-02-06','Winterferien'],['2027-03-22','2027-04-02','Osterferien'],['2027-05-07','2027-05-07','Unterrichtsfrei'],['2027-05-18','2027-05-19','Pfingstferien'],['2027-07-01','2027-08-14','Sommerferien'],['2027-10-11','2027-10-23','Herbstferien'],['2027-12-22','2027-12-31','Weihnachtsferien'],['2028-01-31','2028-02-05','Winterferien'],['2028-04-10','2028-04-22','Osterferien'],['2028-05-26','2028-05-26','Unterrichtsfrei'],['2028-06-01','2028-06-02','Pfingstferien'],['2028-07-01','2028-08-12','Sommerferien']];function school(s){return breaks.find(x=>s>=x[0]&&s<=x[1])?.[2]||''}
function fasting(){let a=get('fastLedger',{});let n=Object.values(a).filter(x=>x==='Nachzuholen').length-Object.values(a).filter(x=>x==='Nachgeholt').length;return `<article><div class="art">☾</div><h2>${Math.max(0,n)} offene Tage</h2><p>Persönliche Zählung</p><p>${esc(a[day]||'Kein Eintrag')}</p>${['Gefastet','Nachzuholen','Nachgeholt','Kein Eintrag'].map(x=>btn(x,`set('fastLedger',{...get('fastLedger',{}),[day]:${q(x)}});show(page)`)).join(' ')}</article>`+Object.entries(a).filter(x=>x[1]!=='Kein Eintrag').sort().map(([d,v])=>`<p>${esc(d)} · ${esc(v)}</p>`).join('')}
function books(){let a=get('Leseliste',[]);return `<article><div style="display:flex;align-items:end;gap:5px;flex-wrap:wrap;border-bottom:6px solid var(--ink)">${a.map((x,i)=>`<button style="writing-mode:vertical-rl;height:110px;background:${['#d7b5b4','#b9c4a9','#e2c9a5'][i%3]};color:#51423b" onclick="edit('Leseliste',${i})">${esc(x.title)} ${x.done?'✓':''}</button>`).join('')}</div><h3>${a.filter(x=>x.done).length} Bücher gelesen</h3></article>`+list('Leseliste')+add('Leseliste',field('title','Buchtitel')+field('note','Autor/in'))}
